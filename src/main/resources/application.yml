spring:
  application:
    name: board
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/board?serverTimezone=Asia/Seoul
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        show_sql: true
        format_sql: true

jwt:
  secret: ${JWT_SECRET} # 비밀키는 공개하면 안되므로 intellij 환경변수로 빼서 사용
  token:
    access-expiration: 3600000 # 1시간 = 1000 * 60 * 60 * 2

logging:
  level:
    org.hibernate.SQL: DEBUG

